name: Flutter Android and iOS
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: flutter-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true
      - name: Analyze and test with per-file coverage gate
        run: |
          cd flutter_app
          flutter pub get --enforce-lockfile
          dart format --output=none --set-exit-if-changed lib test integration_test
          flutter analyze --no-pub
          flutter test --branch-coverage --file-reporter json:coverage/tests.json
          cd ..
          python3 scripts/check_flutter_coverage.py
          python3 scripts/test_flutter_coverage.py
          python3 scripts/build_chatgpt_guide.py --check
          node --test scripts/test_workout_link.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flutter-coverage
          path: flutter_app/coverage/
  android:
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        api: [35]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true
      - name: KVM and compile SDKs
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "platforms;android-36" "build-tools;36.0.0"
      - name: Build native migration baseline
        run: ./gradlew --no-daemon coreCoverageVerification assembleE2e
      - name: Device integration and real OS migration/IO
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -no-audio -no-snapshot -no-boot-anim -gpu swiftshader_indirect -camera-back none -camera-front none
          script: python3 scripts/test_flutter_android.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flutter-android-api-${{ matrix.api }}
          path: |
            e2e/artifacts/flutter-os/
            e2e/artifacts/flutter-integration/
            flutter_app/build/app/outputs/androidTest-results/
            flutter_app/build/app/reports/
            flutter_app/build/app/outputs/flutter-apk/*e2e*.apk
  ios:
    needs: unit
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true
      - name: Compile iOS without signing
        run: python3 scripts/build_flutter.py ios
      - name: Boot an available iPhone simulator
        timeout-minutes: 15
        id: simulator
        run: |
          python3 scripts/ios_simulator.py >> "$GITHUB_OUTPUT"
      - name: Shared Dart scenarios and native iOS links, documents and sharing
        run: python3 scripts/test_flutter_ios.py --device '${{ steps.simulator.outputs.device }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flutter-ios-results
          path: |
            e2e/artifacts/flutter-ios.xcresult
            e2e/artifacts/flutter-ios-integration/
