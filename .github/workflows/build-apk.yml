name: Build latest main APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-latest-main-apk
  cancel-in-progress: true

jobs:
  apk:
    name: Latest main APK
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out latest main
        uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false
      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true
      - name: Install compile SDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "platforms;android-36" "build-tools;36.0.0"
      - name: Source version
        id: source
        run: |
          echo "version=$(git log -1 --format=%cs | tr -d '-')" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"
      - name: Tests, coverage gate, lint and APK
        run: |
          chmod +x gradlew
          cd flutter_app
          flutter pub get --enforce-lockfile
          flutter analyze --no-pub
          flutter test --branch-coverage
          cd ..
          python3 scripts/check_flutter_coverage.py
          python3 scripts/test_flutter_coverage.py
          python3 scripts/build_flutter.py apk --edition personal
          python3 scripts/build_flutter.py apk --edition preview
          cd flutter_app/android && ./gradlew --no-daemon lintPersonalRelease lintPreviewRelease
      - name: Package and verify version
        env:
          APP_VERSION: ${{ steps.source.outputs.version }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          python3 scripts/package_apk.py
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging dist/*.apk > dist/apk-badging.txt
          grep -F "name='com.william.treino'" dist/apk-badging.txt
          grep -F "versionCode='$APP_VERSION'" dist/apk-badging.txt
          grep -F "versionName='$APP_VERSION'" dist/apk-badging.txt
      - name: Downloadable APK
        uses: actions/upload-artifact@v4
        with:
          name: SetHarbor-${{ steps.source.outputs.version }}-${{ steps.source.outputs.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
      - name: Side-by-side link trial APK
        uses: actions/upload-artifact@v4
        with:
          name: SetHarbor-Trial-${{ steps.source.outputs.version }}-${{ steps.source.outputs.sha }}
          path: flutter_app/build/app/outputs/apk/preview/release/*.apk
          if-no-files-found: error
          retention-days: 30
      - name: Test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apk-build-reports-${{ github.run_id }}
          path: |
            flutter_app/coverage/
            flutter_app/build/app/reports/
          if-no-files-found: warn
          retention-days: 14
