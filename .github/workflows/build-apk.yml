name: Build latest main APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-latest-main-apk
  cancel-in-progress: true

jobs:
  apk:
    name: Latest main APK
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out latest main
        uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false
      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Install compile SDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Source version
        id: source
        run: |
          echo "version=$(git log -1 --format=%cs | tr -d '-')" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"
      - name: Tests, coverage gate, lint and APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon coreCoverageVerification lintDebug assembleDebug
      - name: Package and verify version
        env:
          APP_VERSION: ${{ steps.source.outputs.version }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          python3 scripts/package_apk.py
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging dist/*.apk > dist/apk-badging.txt
          grep -F "name='com.william.treino'" dist/apk-badging.txt
          grep -F "versionCode='$APP_VERSION'" dist/apk-badging.txt
          grep -F "versionName='$APP_VERSION'" dist/apk-badging.txt
      - name: Downloadable APK
        uses: actions/upload-artifact@v4
        with:
          name: SetHarbor-${{ steps.source.outputs.version }}-${{ steps.source.outputs.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
      - name: Test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apk-build-reports-${{ github.run_id }}
          path: app/build/reports/
          if-no-files-found: warn
          retention-days: 14
