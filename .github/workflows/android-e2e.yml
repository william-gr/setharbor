name: Android E2E

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: E2E Android API ${{ matrix.api }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        api: [29, 35]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Enable hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install compile SDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Build and static checks
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug assembleE2e lintDebug
          python3 -m py_compile e2e/*.py
      - name: Execute all end-to-end scenarios
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -no-audio -no-snapshot -no-boot-anim -gpu swiftshader_indirect -camera-back none -camera-front none
          script: |
            adb shell input keyevent 82
            ADB="$ANDROID_HOME/platform-tools/adb" E2E_APK="$PWD/app/build/outputs/apk/e2e/app-e2e.apk" python3 e2e/run.py
      - name: Upload results, screenshots, logs and APKs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-e2e-api-${{ matrix.api }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            e2e/artifacts/
            app/build/reports/
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/e2e/*.apk
