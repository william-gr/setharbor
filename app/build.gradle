plugins { id 'com.android.application' }
android {
    namespace 'com.william.treino'
    compileSdk 35
    defaultConfig {
        applicationId 'com.william.treino'
        minSdk 26
        targetSdk 35
        versionCode 6
        versionName '1.5'
    }
    // The personal update key stays local and is not committed to Git.
    def personalKey = file('../signing/personal-debug.jks')
    if (personalKey.exists()) {
        signingConfigs {
            personalDebug {
                storeFile personalKey
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
        buildTypes { debug { signingConfig signingConfigs.personalDebug } }
    }
    buildTypes {
        e2e {
            initWith debug
            applicationIdSuffix '.e2e'
            matchingFallbacks = ['debug']
        }
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
